name: SENTRY CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: PyTorch & SENTRY Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libsndfile1 ffmpeg

    - name: Install PyTorch CPU Engine (Fast & Lightweight)
      run: |
        python -m pip install --upgrade pip
        pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

    - name: Install SENTRY Application Dependencies
      run: |
        pip install numpy scipy fastapi uvicorn websockets pydantic python-multipart scikit-learn requests tqdm pytest httpx

    - name: Run 27-Test Automated Verification Suite
      run: |
        python -m pytest tests/ -v
      env:
        PYTHONPATH: .
